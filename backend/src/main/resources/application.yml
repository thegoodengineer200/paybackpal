server:
  port: 8080

spring:
  application:
    name: paybackpal-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/paybackpal
    username: paybackpal_user
    password: paybackpal_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  public-actions:
    base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:cGF5YmFja3BhbC1sb2NhbC1kZXYtc2VjcmV0LW11c3QtYmUtMzItYnl0ZXM=}
    expiration-minutes: 1440