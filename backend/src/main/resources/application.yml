server:
  port: 8080

spring:
  application:
    name: paybackpal-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/paybackpal
    username: paybackpal_user
    password: paybackpal_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info